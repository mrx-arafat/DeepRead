    />
    <title>DeepRead</title>
    <script>
      // DeepRead answers on 127.0.0.1 only, and a browser keeps a separate sign-in for "localhost". So one address:
      // whichever name is typed, the reader lands on the one where their 30-day sign-in lives.
      if (location.hostname === "localhost" || location.hostname === "[::1]") {
        location.replace("http://127.0.0.1" + (location.port ? ":" + location.port : "") + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
