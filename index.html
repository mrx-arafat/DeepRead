<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DeepRead</title>
    <script>
      // DeepRead answers on 127.0.0.1 only, and a browser keeps a separate sign-in for "localhost". So one address:
      // whichever name is typed, the reader lands on the one where their 30-day sign-in lives.
      if (location.hostname === "localhost" || location.hostname === "[::1]") {
        location.replace("http://127.0.0.1" + (location.port ? ":" + location.port : "") + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
