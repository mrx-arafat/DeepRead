# Pages-only understanding journeys isolated from the Scroll journeys.
name: deepread-understanding-pages

include:
  - "**/*.test.yaml"
  - "**/*.module.yaml"

retries: 0
parallel: 1
recordVideo: on-fail
gitMainBranch: main
fileFormat: v2

advanced:
  aiActionShorthand: true

browser:
  disableSecondaryCacheResolution: true

ai:
  useMemory: true
  failureRecovery: true
  agentConfig:
    locator: v5
    assertion: v5
    visual-assertion: v5
    text-extraction: v3.0
    failure-recovery: v2.1

environments:
  - name: local
    baseUrl: http://localhost:5187
