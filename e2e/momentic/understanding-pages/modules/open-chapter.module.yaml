fileType: momentic/module/v2
id: dr-und-pages-open-chapter
name: Open a chapter in Pages mode
parameters:
  - name: CHAPTER_ID
    default:
      string: c3
steps:
  - click:
      css: a.shelf-link
  - waitForUrl:
      substring: /book/
      timeout: 15000
  - checkElementVisible:
      css: "main.page > article.chapter:nth-of-type(1) .chapter-text"
      timeout: 20000
  - click:
      css: button[aria-label="Chapters"]
  - click:
      css: .toc a[href$="/{{ env.CHAPTER_ID }}"]
  - checkElementVisible:
      css: article[data-chapter="{{ env.CHAPTER_ID }}"] h2
      timeout: 20000
