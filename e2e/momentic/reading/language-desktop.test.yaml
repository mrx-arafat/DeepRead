fileType: momentic/test/v2
id: dr-read-language-desktop
description: "Journey 6 at desktop 1440: what the language picker is, what changing it does to a word lookup, and whether the choice survives a reload."
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  - navigate: /book/{{ env.BOOK_ID }}/c3
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - click:
      css: button[aria-label="Reading settings"]
  - javascript:
      environment: browser
      saveAs: LANGUI
      code: |-
        const sel = document.querySelector('#reading-settings-lang'); const label = sel.labels[0]; const hint = document.getElementById(sel.getAttribute('aria-describedby'));
        const b = sel.getBoundingClientRect(); const l = label.getBoundingClientRect();
        return JSON.stringify({ selected: sel.options[sel.selectedIndex].text, options: Array.from(sel.options).map((o) => o.text), label: label.textContent, labelVisible: l.width > 1 && l.height > 1, hint: hint && hint.textContent, visibleTextNearby: document.querySelector('.settings').innerText, rect: { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) }, stored: localStorage.getItem('deepread.prefs') });
  - assertVisually:
      that: An open reading settings menu shows a visible "Explain in" label over a language picker set to Bangla, and a sentence under it saying word meanings and explanations come in Bangla while the book stays in English
      timeout: 20000
  - javascript: |-
      const ui = JSON.parse(env.LANGUI);
      assert(ui.labelVisible && ui.label === 'Explain in', `the language picker label is "${ui.label}", visible: ${ui.labelVisible}`);
      assert(ui.hint && ui.hint.includes('Bangla'), `the hint under the picker does not name the language: "${ui.hint}"`)
  - press: Escape
  - module: ./modules/word-position.module.yaml
  - click:
      x: "{{ env.WORDX }}"
      y: "{{ env.WORDY }}"
  - checkElementVisible:
      css: '[role="dialog"][aria-label^="Meaning of"]'
      timeout: 10000
  - wait: 7000
  - javascript:
      environment: browser
      saveAs: POP_BN
      code: return document.querySelector('[role="dialog"][aria-label^="Meaning of"]').innerText
  - assertVisually:
      that: A small card next to the tapped word shows the word, a meaning in Bangla script, a simple English meaning and an example sentence
      timeout: 20000
  - press: Escape
  - click:
      css: button[aria-label="Reading settings"]
  - select:
      css: "#reading-settings-lang"
      label: Spanish
  - javascript:
      environment: browser
      saveAs: AFTER_SWITCH
      code: |-
        return JSON.stringify({ selected: document.querySelector('#reading-settings-lang').selectedOptions[0].text, hint: document.querySelector('.settings-hint').textContent, dialogOpen: !!document.querySelector('[role="dialog"]'), bodyLang: document.documentElement.lang, toasts: document.querySelectorAll('[role="status"],[role="alert"]').length, stored: localStorage.getItem('deepread.prefs') });
  - javascript: |-
      const after = JSON.parse(env.AFTER_SWITCH);
      assert(after.hint.includes('Spanish'), `after choosing Spanish the hint still says: "${after.hint}"`)
  - press: Escape
  - module: ./modules/word-position.module.yaml
  - click:
      x: "{{ env.WORDX }}"
      y: "{{ env.WORDY }}"
  - checkElementVisible:
      css: '[role="dialog"][aria-label^="Meaning of"]'
      timeout: 10000
  - wait: 7000
  - javascript:
      environment: browser
      saveAs: POP_ES
      code: return document.querySelector('[role="dialog"][aria-label^="Meaning of"]').innerText
  - assertVisually:
      that: The word card now shows the meaning in Spanish instead of Bangla
      timeout: 20000
  - refresh
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - javascript:
      environment: browser
      saveAs: LANG_AFTER_RELOAD
      code: return document.querySelector('#reading-settings-lang').selectedOptions[0].text
