fileType: momentic/test/v2
id: dr-read-through-desktop
description: "Journey 2 at desktop 1440: scroll the whole book from Front Matter to End of the book, probing chapter loading, boundaries and progress at every step."
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  - module: ./modules/install-monitor.module.yaml
  - module: ./modules/metrics.module.yaml
  - while:
      maxIterations: 200
      do:
        - scrollDown: 1000
        - module: ./modules/probe.module.yaml
  - module: ./modules/metrics.module.yaml
  - assertVisually:
      that: The very end of the book is on screen. Under the last section there is a closing "End of the book" heading, a short line naming the book, and a clear "Back to your books" button, with no spinner or error
      timeout: 20000
  # The closing page is also the way back to the shelf.
  - click:
      css: .book-end a.button
  - checkPageContains:
      text: Your books
      timeout: 10000
