fileType: momentic/test/v2
id: dr-read-resume-desktop
description: "Journey 4 at desktop 1440: read part of a later chapter, reload the page, go back to the library and reopen the book, and check the reader lands where they stopped."
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  - click:
      css: button[aria-label="Chapters"]
  - click:
      css: a.toc-link[href$="/c8"]
  - waitForUrl:
      substring: /c8
      timeout: 10000
  - wait: 800
  - scrollDown: 2600
  - wait: 400
  - scrollDown: 1900
  - wait: 400
  - scrollDown: 210
  - wait: 2600
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT1', env.SPOT)
  - module: ./modules/eye-line.module.yaml
  - javascript: setVariable('LINE1', env.EYE_LINE)
  - refresh
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - wait: 1500
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT2', env.SPOT)
  - module: ./modules/eye-line.module.yaml
  - javascript: setVariable('LINE2', env.EYE_LINE)
  - javascript: |-
      const a = JSON.parse(env.SPOT1), b = JSON.parse(env.SPOT2);
      assert(a.block === b.block, `after reload the reader is in ${b.block} ("${b.snippet}") but was in ${a.block} ("${a.snippet}")`)
  - click:
      coords: "32, 26"
  - checkPageContains:
      text: Your books
      timeout: 10000
  - javascript:
      environment: browser
      saveAs: SHELF
      code: return Array.from(document.querySelectorAll('.shelf-item')).map((li) => li.textContent).join(' | ')
  - click:
      css: a.shelf-link
  - waitForUrl:
      substring: /book/
      timeout: 15000
  - wait: 1800
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT3', env.SPOT)
  # The book reopens in the same page, so pick the line under the top bar afresh rather than follow the last one.
  - javascript:
      environment: browser
      code: |-
        window.__eyeLine = null;
        return 'picking afresh';
  - module: ./modules/eye-line.module.yaml
  - javascript: setVariable('LINE3', env.EYE_LINE)
  - javascript: |-
      const a = JSON.parse(env.SPOT1), c = JSON.parse(env.SPOT3);
      assert(a.block === c.block, `after leaving and reopening the book the reader is in ${c.block} ("${c.snippet}") but was in ${a.block} ("${a.snippet}")`)
  # The same line comes back under the top bar. Not to the pixel: it opens where a paragraph's first line would.
  - javascript: |-
      const a = JSON.parse(env.LINE1), b = JSON.parse(env.LINE2);
      assert(a.block === b.block && a.offset === b.offset, `after reload the line under the top bar starts "${b.text}" (${b.block}, ${b.top}px down) but it was "${a.text}" (${a.block}, ${a.top}px down)`)
  - javascript: |-
      const a = JSON.parse(env.LINE1), c = JSON.parse(env.LINE3);
      assert(a.block === c.block && a.offset === c.offset, `after reopening the book the line under the top bar starts "${c.text}" (${c.block}, ${c.top}px down) but it was "${a.text}" (${a.block}, ${a.top}px down)`)
  # A chapter opened by its link and left without scrolling is still where the reader is: the library says so, and
  # the book reopens at that chapter's top, heading and all, as it was left.
  - navigate: /book/{{ env.BOOK_ID }}/c10
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - wait: 2600
  - click:
      coords: "32, 26"
  - checkPageContains:
      text: Your books
      timeout: 10000
  - javascript:
      environment: browser
      saveAs: SHELF_C10
      code: return document.querySelector('.shelf-item').innerText
  - click:
      css: a.shelf-link
  - waitForUrl:
      substring: /book/
      timeout: 15000
  - wait: 1800
  - javascript:
      environment: browser
      saveAs: REOPEN_C10
      code: |-
        // The chapter the book reopened at, not the one put above it.
        const h = document.querySelector(`[data-chapter="${location.pathname.split('/').pop()}"] .chapter-head h2`);
        return JSON.stringify({ heading: h && h.textContent, headingTop: h && Math.round(h.getBoundingClientRect().top), scrollY: Math.round(scrollY) });
  - javascript: |-
      const r = JSON.parse(env.REOPEN_C10);
      assert(/CHAPTER VIII/.test(env.SHELF_C10), `after opening Chapter VIII and leaving without scrolling, the library row says "${env.SHELF_C10}"`)
      assert(/CHAPTER VIII/.test(r.heading) && r.headingTop > 52 && r.headingTop < 900, `reopening after a look at the top of Chapter VIII shows "${r.heading}" with its heading at ${r.headingTop}px (scrollY ${r.scrollY})`)
