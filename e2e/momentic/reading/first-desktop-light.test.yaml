fileType: momentic/test/v2
id: dr-read-first-desktop-light
description: Journey 1 at desktop 1440 wide, light theme. Open the book from the library and judge the first reading screen and real chapter prose.
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  # The book reopens at the line where the reader stopped, which is usually partway through a chapter.
  - assertVisually:
      that: The reading page shows a top bar and the book text under it, with no overlapping elements
      timeout: 20000
  - module: ./modules/metrics.module.yaml
  # A first visit has a tip in the right margin: the text makes room for it, and all of it is on screen.
  - javascript:
      environment: browser
      code: |-
        const tip = document.querySelector('.tip').getBoundingClientRect();
        const text = document.querySelector('.chapter-text').getBoundingClientRect();
        if (tip.right > document.documentElement.clientWidth) throw new Error(`the tip runs past the right edge of the window (right ${Math.round(tip.right)})`);
        if (tip.left < text.right) throw new Error('the tip overlaps the text');
  - click:
      css: button[aria-label="Dismiss tip"]
  # With nothing in the margin, the text sits in the middle of the window.
  - javascript:
      environment: browser
      code: |-
        await new Promise((resolve) => setTimeout(resolve, 600));
        const text = document.querySelector('.chapter-text').getBoundingClientRect();
        const off = Math.round(text.left + text.width / 2 - document.documentElement.clientWidth / 2);
        if (Math.abs(off) > 10) throw new Error(`with nothing in the margin the text column sits ${off}px off the middle of the window`);
  - scrollDown: 700
  - assertVisually:
      that: The text on screen is book prose or front matter set in a serif typeface with comfortable spacing between paragraphs, and nothing overlaps. A line cut off cleanly at the lower edge of the top bar has only scrolled under the bar and is fine
      timeout: 20000
  - navigate: /book/{{ env.BOOK_ID }}/c3
  - checkPageContains:
      text: Before you read
      timeout: 15000
  # Journeys run side by side on one book, and another may have left the reader partway through this chapter.
  # This check is about how a chapter opens, so look at its top.
  - javascript:
      environment: browser
      code: |-
        document.querySelector(`article[data-chapter="${location.pathname.split('/').pop()}"]`).scrollIntoView({ block: 'start', behavior: 'instant' });
        return 'at the chapter start';
  - assertVisually:
      that: A chapter opens with a clear heading, a small line above it, a "Before you read" box and then paragraphs of book text
      timeout: 20000
  - scrollDown: 450
  - module: ./modules/metrics.module.yaml
  - assertVisually:
      that: Paragraphs of book text are easy to read, with even line spacing, readable text size, and enough contrast between the text and the background
      timeout: 20000
