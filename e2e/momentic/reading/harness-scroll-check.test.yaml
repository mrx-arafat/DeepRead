fileType: momentic/test/v2
id: dr-read-harness-scroll
description: "Diagnostic: does a Momentic click on a reading settings button scroll the page by itself? Compares a selector click, a coordinate click and a plain page click while the reader is deep in a chapter."
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  - navigate: /book/{{ env.BOOK_ID }}/c4
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - scrollDown: 2400
  - wait: 600
  - javascript:
      environment: browser
      saveAs: Y0
      code: return Math.round(scrollY)
  - click:
      css: button[aria-label="Reading settings"]
  - click:
      css: button[aria-label="Smaller text"]
  - javascript:
      environment: browser
      saveAs: Y_AFTER_SELECTOR_CLICK
      code: return Math.round(scrollY)
  - scrollDown: 400
  - wait: 400
  - javascript:
      environment: browser
      saveAs: Y1
      code: return Math.round(scrollY)
  - click:
      coords: "1341, 129"
  - javascript:
      environment: browser
      saveAs: Y_AFTER_COORD_CLICK
      code: return Math.round(scrollY)
  - javascript:
      environment: browser
      saveAs: SIZE_AFTER_COORD_CLICK
      code: return getComputedStyle(document.querySelector('.chapter-text')).fontSize
