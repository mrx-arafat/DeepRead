fileType: momentic/test/v2
id: dr-read-first-desktop-dark
description: Journey 1 at desktop 1440 wide, dark theme.
viewport: "1440, 900"
steps:
  - localStorage:
      key: deepread.prefs
      value: '{"theme":"dark"}'
  - refresh
  - module: ./modules/open-book.module.yaml
  # The book reopens at the line where the reader stopped, which is usually partway through a chapter.
  - assertVisually:
      that: The reading page shows a top bar and the book text under it, with no overlapping elements
      timeout: 20000
  - module: ./modules/metrics.module.yaml
  - scrollDown: 700
  - assertVisually:
      that: The text on screen is book prose or front matter set in a serif typeface with comfortable spacing between paragraphs, and nothing overlaps. A line cut off cleanly at the lower edge of the top bar has only scrolled under the bar and is fine
      timeout: 20000
  - navigate: /book/{{ env.BOOK_ID }}/c3
  - checkPageContains:
      text: Before you read
      timeout: 15000
  # Journeys run side by side on one book, and another may have left the reader partway through this chapter.
  # This check is about how a chapter opens, so look at its top.
  - javascript:
      environment: browser
      code: |-
        document.querySelector(`article[data-chapter="${location.pathname.split('/').pop()}"]`).scrollIntoView({ block: 'start', behavior: 'instant' });
        return 'at the chapter start';
  - assertVisually:
      that: A chapter opens with a clear heading, a small line above it, a "Before you read" box and then paragraphs of book text
      timeout: 20000
  - scrollDown: 450
  - module: ./modules/metrics.module.yaml
  - assertVisually:
      that: Paragraphs of book text are easy to read, with even line spacing, readable text size, and enough contrast between the text and the background
      timeout: 20000
