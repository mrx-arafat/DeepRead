fileType: momentic/test/v2
id: dr-read-phone-controls
description: "Journeys 5, 6 and 7 at phone 390: which top bar controls a phone reader actually has, touch target sizes, and whether text size, theme and language can be changed from the Aa menu."
viewport: "390, 844"
steps:
  - module: ./modules/open-book.module.yaml
  - module: ./modules/metrics.module.yaml
  - click:
      css: button[aria-label="Reading settings"]
  - javascript:
      environment: browser
      saveAs: PHONE_CONTROLS
      code: |-
        const all = Array.from(document.querySelectorAll('.topbar button, .topbar a, .topbar select, .topbar-percent, .topbar-title'));
        return JSON.stringify(all.map((el) => { const cs = getComputedStyle(el); const b = el.getBoundingClientRect(); return { cls: el.className, label: el.getAttribute('aria-label') || (el.textContent || '').trim().slice(0, 30), display: cs.display, w: Math.round(b.width), h: Math.round(b.height), x: Math.round(b.x) }; }));
  - press: Escape
  - scrollDown: 900
  - assertVisually:
      that: The reading column fills the phone screen with comfortable side margins and no horizontal scrolling or clipped words
      timeout: 20000
  - click:
      css: button[aria-label="Reading settings"]
  - click:
      css: input[value="dark"]
  - press: Escape
  - module: ./modules/metrics.module.yaml
  - assertVisually:
      that: The page switched to a dark theme and the text is readable
      timeout: 20000
  - javascript: |-
      const items = JSON.parse(env.PHONE_CONTROLS);
      const by = (label) => items.find((i) => i.label === label);
      const failures = [];
      const title = items.find((i) => i.cls === 'topbar-title');
      if (title.w < 140) failures.push(`the book title in the top bar is only ${title.w}px wide (shown as "The Proble...")`);
      for (const label of ['Smaller text', 'Larger text']) if (!by(label) || by(label).w === 0) failures.push(`"${label}" is not available on a phone`);
      const lang = items.find((i) => i.label.startsWith('Bangla'));
      if (!lang || lang.w === 0) failures.push('the language picker is not available on a phone');
      for (const i of items.filter((x) => x.w > 0 && x.cls !== 'topbar-title' && x.cls !== 'topbar-percent')) if (i.h < 44 || i.w < 44) failures.push(`"${i.label}" is ${i.w}x${i.h}px, smaller than a 44px touch target`);
      assert(failures.length === 0, failures.join('; '))
