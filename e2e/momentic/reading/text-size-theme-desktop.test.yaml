fileType: momentic/test/v2
id: dr-read-size-theme-desktop
description: "Journey 5 at desktop 1440: text size and theme in the Aa menu apply instantly, persist after reload, and keep the reader's place in the text."
viewport: "1440, 900"
steps:
  - module: ./modules/open-book.module.yaml
  - navigate: /book/{{ env.BOOK_ID }}/c4
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - scrollDown: 2400
  - wait: 2600
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT_BEFORE', env.SPOT)
  - click:
      coords: "1408, 26"
  - click:
      css: button[aria-label="Larger text"]
  - module: ./modules/metrics.module.yaml
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT_AFTER1', env.SPOT)
  - click:
      css: button[aria-label="Larger text"]
      times: 6
  - module: ./modules/metrics.module.yaml
  - javascript: |-
      const m = JSON.parse(env.METRICS);
      assert(m.charsPerLineMedian >= 55 && m.charsPerLineMedian <= 75, `at the largest text size a line holds ${m.charsPerLineMedian} characters, not 55-75`)
  - assertVisually:
      that: The book text is at its largest size, the Larger text button in the reading settings menu looks disabled, and the paragraphs still fit the column without clipping
      timeout: 20000
  - click:
      css: button[aria-label="Smaller text"]
      times: 11
  - module: ./modules/metrics.module.yaml
  - javascript: |-
      const m = JSON.parse(env.METRICS);
      assert(m.charsPerLineMedian >= 55 && m.charsPerLineMedian <= 75, `at the smallest text size a line holds ${m.charsPerLineMedian} characters, not 55-75`)
  - assertVisually:
      that: The book text is at its smallest size and the Smaller text button in the reading settings menu looks disabled
      timeout: 20000
  - click:
      css: button[aria-label="Larger text"]
      times: 8
  - module: ./modules/spot.module.yaml
  - javascript: setVariable('SPOT_23', env.SPOT)
  - wait: 2200
  - refresh
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - wait: 1500
  - module: ./modules/spot.module.yaml
  - module: ./modules/metrics.module.yaml
  - javascript: |-
      const a = JSON.parse(env.SPOT_23), b = JSON.parse(env.SPOT);
      assert(b.fontPx === '23px', `text size after reload is ${b.fontPx}, expected 23px`)
  - click:
      coords: "1408, 26"
  - click:
      css: input[value="dark"]
  - press: Escape
  - module: ./modules/metrics.module.yaml
  - assertVisually:
      that: The page is in a dark theme with light text on a dark background, and the book text is still readable
      timeout: 20000
  - refresh
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - module: ./modules/metrics.module.yaml
  - click:
      coords: "1408, 26"
  - click:
      css: input[value="light"]
  - press: Escape
  - module: ./modules/metrics.module.yaml
  - javascript: |-
      const a = JSON.parse(env.SPOT_BEFORE), b = JSON.parse(env.SPOT_AFTER1);
      assert(a.eyeText === b.eyeText, `after one tap on Larger text the text under the reader's eyes changed from "${a.eyeText}" (${a.block}) to "${b.eyeText}" (${b.block}), scrollY ${a.scrollY} to ${b.scrollY}`)
