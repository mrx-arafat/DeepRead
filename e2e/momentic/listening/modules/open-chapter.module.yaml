fileType: momentic/module/v2
id: listening-open-chapter
name: open-chapter
parameters:
  - name: CHAPTER
    default:
      string: c3
steps:
  - navigate: /book/the-problems-of-philosophy-8c4e7684/{{ env.CHAPTER }}
  - checkElementVisible:
      css: "main.page > article.chapter:nth-of-type(1) h1"
      timeout: 15000
  - javascript:
      environment: browser
      code: |-
        window.scrollTo({ top: 0, behavior: 'instant' });
        return 'at top';
  - wait: 500
