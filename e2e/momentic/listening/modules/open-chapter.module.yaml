fileType: momentic/module/v2
id: listening-open-chapter
name: open-chapter
parameters:
  - name: CHAPTER
    default:
      string: c3
steps:
  - navigate: /book/the-problems-of-philosophy-8c4e7684/{{ env.CHAPTER }}
  - checkElementVisible:
      css: "article[data-chapter='{{ env.CHAPTER }}'] h2"
      timeout: 15000
  # The start of the chapter, not the top of the page: the chapter before it is put above.
  - javascript:
      environment: browser
      code: |-
        document.querySelector(`article[data-chapter="${location.pathname.split('/').pop()}"]`).scrollIntoView({ block: 'start', behavior: 'instant' });
        return 'at the chapter start';
  - wait: 500
