fileType: momentic/test/v2
id: listening-contrast-desktop
description: Journey 8 - computed colour contrast of body text, muted text, player bar, word card, selection bar and the highlight colours in both themes, desktop 1440 (stubbed speech)
viewport:
  width: 1440
  height: 900
steps:
  - module: ../modules/open-chapter.module.yaml
  - module: ../modules/stub-speech.module.yaml
  - javascript:
      environment: browser
      code: window.__stub.wordMs = 900; return 'slow';
  - click:
      coords: 1119, 25
  - wait: 700
  - module: ../modules/contrast-scan.module.yaml
  - click:
      css: '.listen-bar button[aria-label="Stop listening"]'
  - click:
      coords: 370, 622
  - checkElementVisible:
      css: '.word-popover'
      timeout: 5000
  - wait: 1500
  - module: ../modules/contrast-scan.module.yaml
  - click:
      coords: 1408, 25
  - wait: 500
  - module: ../modules/contrast-scan.module.yaml
  - mouseDrag:
      coords: 276, 655
      delta: 380, 0
      steps: 12
  - checkElementVisible:
      css: '.selection-bar'
      timeout: 5000
  - module: ../modules/contrast-scan.module.yaml
