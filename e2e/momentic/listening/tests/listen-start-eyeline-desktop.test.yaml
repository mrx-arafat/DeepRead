fileType: momentic/test/v2
id: listening-start-eyeline
description: Listen pressed mid-paragraph should start at the sentence being read, not the first sentence of that paragraph above it. Desktop 1440 (stubbed speech)
viewport:
  width: 1440
  height: 900
steps:
  - module: ../modules/open-chapter.module.yaml
  - module: ../modules/stub-speech.module.yaml
  - javascript:
      environment: browser
      code: window.__stub.wordMs = 500; return 'slow';
  - javascript:
      environment: browser
      saveAs: EYE_LINE
      code: |-
        // Put the middle of a long paragraph at the eye line, so the line being read is plainly inside it and not in
        // a gap between two paragraphs.
        const long = [...document.querySelectorAll('[data-block]')].find((b) => b.getBoundingClientRect().height > 8 * parseFloat(getComputedStyle(b).lineHeight));
        window.scrollTo({ top: long.getBoundingClientRect().top + scrollY + 3.5 * parseFloat(getComputedStyle(long).lineHeight) - 100, behavior: 'instant' });
        // Where the reader's eyes are is read at the moment of the click: the click itself may scroll the page.
        document.addEventListener(
          'click',
          () => {
            const caret = document.caretRangeFromPoint(212, 100);
            window.__eye = { block: caret.startContainer.parentElement.dataset.block, offset: caret.startOffset };
          },
          { capture: true, once: true },
        );
        return 'armed';
  - wait: 600
  - click:
      css: '.topbar-tools button[aria-pressed]'
  - wait: 1200
  - javascript:
      environment: browser
      saveAs: STARTED_AT
      code: |-
        const need = (ok, msg) => { if (!ok) throw new Error(msg); };
        const r = [...CSS.highlights.get('dr-sentence')][0];
        const block = r.startContainer.parentElement.dataset.block;
        const info = JSON.stringify({ eye: window.__eye, startedBlock: block, sentenceEnd: r.endOffset });
        need(block === window.__eye.block && r.endOffset > window.__eye.offset, 'listening started above where the reader was reading. ' + info);
        return info;
