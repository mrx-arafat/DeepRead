fileType: momentic/test/v2
id: listening-end-of-book-desktop
description: Journey 4 edge - reading aloud reaches the last sentence of the book, desktop 1440 (stubbed speech)
viewport:
  width: 1440
  height: 900
steps:
  - module:
      path: ../modules/open-chapter.module.yaml
      inputs:
        CHAPTER:
          string: c18
  - module: ../modules/stub-speech.module.yaml
  # Start near the end of the last chapter: reading leaves a reader's pause after every sentence, so the whole
  # chapter would take minutes even with a fast voice.
  - javascript:
      environment: browser
      code: |-
        window.__stub.wordMs = 8;
        const blocks = [...document.querySelectorAll('article.chapter [data-block]')];
        const from = blocks[blocks.length - 4];
        window.scrollTo({ top: from.getBoundingClientRect().top + scrollY - 200, behavior: 'instant' });
        return 'near the end';
  - wait: 500
  - click:
      css: '.topbar-tools button[aria-pressed]'
  - wait: 3000
  - module: ../modules/read-listen-state.module.yaml
  - wait: 15000
  - module: ../modules/read-listen-state.module.yaml
  - assert: The page says End of the book and the player bar is still showing at the bottom
  - javascript:
      environment: browser
      saveAs: END_STATE
      code: |-
        const need = (ok, msg) => { if (!ok) throw new Error(msg); };
        const end = [...document.querySelectorAll('.flow-end')].pop();
        const bar = document.querySelector('.listen-bar');
        need(window.__stub.spoken.length >= 3, 'the last paragraphs should have been read, got ' + window.__stub.spoken.length);
        need(bar && bar.querySelector('.listen-play').getAttribute('aria-label') === 'Play', 'at the end the player is paused with a Play button');
        need(end && /^End of the book/.test(end.textContent.trim()), 'the page ends with the End of the book heading');
        need(end.querySelector('a[href="/"]'), 'the End of the book page links back to the library');
        return JSON.stringify({ flowEnd: end.textContent.trim(), spoken: window.__stub.spoken.length, last: window.__stub.spoken.slice(-1).map((s) => s.text.slice(0, 40)) });
