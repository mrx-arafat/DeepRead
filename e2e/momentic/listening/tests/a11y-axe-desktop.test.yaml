fileType: momentic/test/v2
id: listening-a11y-axe-desktop
description: Journey 7 and 8 - axe-core scan of the reader with the player bar open, light then dark theme, desktop 1440 (stubbed speech)
viewport:
  width: 1440
  height: 900
steps:
  - module: ../modules/open-chapter.module.yaml
  - module: ../modules/stub-speech.module.yaml
  - javascript:
      environment: browser
      code: window.__stub.wordMs = 800; return 'slow';
  - click:
      css: '.topbar-tools button[aria-pressed]'
  - wait: 600
  - module: ../modules/axe-scan.module.yaml
  # The dark page is chosen in the Aa menu.
  - click:
      css: 'button[popovertarget="reading-settings"]'
  - click:
      css: '#reading-settings input[value="dark"]'
  - press: Escape
  - wait: 500
  - module: ../modules/axe-scan.module.yaml
