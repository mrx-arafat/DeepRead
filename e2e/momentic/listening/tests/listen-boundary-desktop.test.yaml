fileType: momentic/test/v2
id: listening-boundary-desktop
description: Journey 4 - keep listening from the end of the Preface into the next chapter, desktop 1440 (stubbed speech)
viewport:
  width: 1440
  height: 900
steps:
  - module:
      path: ../modules/open-chapter.module.yaml
      inputs:
        CHAPTER:
          string: c2
  - module: ../modules/stub-speech.module.yaml
  - javascript:
      environment: browser
      code: window.__stub.wordMs = 25; return 'fast words';
  - click:
      coords: 310, 761
  - checkElementVisible:
      css: '.word-popover'
      timeout: 5000
  - javascript:
      environment: browser
      saveAs: BLOCK_OF_WORD
      code: |-
        return JSON.stringify({ ids: [...document.querySelectorAll('[data-block]')].map((b) => b.dataset.block + ':' + b.textContent.slice(0, 18)), lookup: [...CSS.highlights.get('dr-word') || []].map((r) => r.toString()) });
  - click:
      css: '.word-popover .quiet-button'
  - wait: 2500
  - module: ../modules/read-listen-state.module.yaml
  - wait: 6000
  - javascript:
      environment: browser
      saveAs: CROSSING
      code: |-
        const st = window.__stub;
        const h = (n) => { const hl = CSS.highlights.get(n); return hl ? [...hl].map((r) => r.toString().slice(0, 30)).join('|') : null; };
        return JSON.stringify({ spoken: st.spoken.map((s) => s.text.slice(0, 22)), sentence: h('dr-sentence'), sy: Math.round(scrollY), title: document.querySelector('.topbar-title').textContent, url: location.pathname, playing: document.querySelector('.listen-play') && document.querySelector('.listen-play').getAttribute('aria-label') });
  - javascript:
      environment: browser
      saveAs: BOUNDARY_ASSERT
      code: |-
        const need = (ok, msg) => { if (!ok) throw new Error(msg); };
        const st = window.__stub;
        const texts = st.spoken.map((s) => s.text);
        need(texts.indexOf('1912') !== -1, 'the last block of the Preface should have been read');
        need(texts[texts.indexOf('1912') + 1] === 'CHAPTER I. APPEARANCE AND REALITY', 'the next chapter should open with its title being read, got ' + texts[texts.indexOf('1912') + 1]);
        need(texts[texts.indexOf('1912') + 2].startsWith('Is there any knowledge'), 'reading should carry on into the first sentence of the next chapter');
        need(location.pathname.endsWith('/c3'), 'the address should follow into the next chapter, got ' + location.pathname);
        need(document.querySelector('.topbar-title').textContent.includes('CHAPTER I.'), 'the top bar should name the new chapter');
        need(document.querySelector('.listen-bar'), 'the player stays open across the boundary');
        return 'ok';
  - assert: The player bar is still showing and the highlighted green sentence is inside the next chapter, CHAPTER I. APPEARANCE AND REALITY
