fileType: momentic/test/v2
id: library-keyboard-flow
description: "A keyboard-only reader tabs through the library. Records the order of focus stops and checks every stop shows a visible focus ring. Run from the repo root."
viewport: 1440, 900
before:
  - module: ./modules/reset-library.module.yaml
steps:
  - refresh
  - module: ./modules/add-fixture-book.module.yaml
  # The reader saves the place about a second after a book opens; with it the library also offers a Continue reading card, which is a stop of its own.
  - wait: 2000
  - click: Back to your books
  - checkPageContains: Your books
  - javascript:
      environment: browser
      code: |-
        document.activeElement?.blur();
        window.scrollTo(0, 0);
        return document.activeElement.tagName;
  - press: Tab
  - javascript:
      environment: browser
      saveAs: STOP_1
      code: |-
        const e = document.activeElement; const cs = getComputedStyle(e);
        return { name: e.getAttribute("aria-label") || e.innerText.split("\n")[0], outline: cs.outlineStyle + " " + cs.outlineWidth + " " + cs.outlineColor };
  - press: Tab
  - javascript:
      environment: browser
      saveAs: STOP_2
      code: |-
        const e = document.activeElement; const cs = getComputedStyle(e);
        return { name: e.getAttribute("aria-label") || e.innerText.split("\n")[0], tag: e.tagName, outline: cs.outlineStyle + " " + cs.outlineWidth + " " + cs.outlineColor };
  - assertVisually: The Continue button on the Continue reading card shows a clearly visible keyboard focus indicator (outline or ring)
  - press: Tab
  - javascript:
      environment: browser
      saveAs: STOP_3
      code: |-
        const e = document.activeElement; const cs = getComputedStyle(e);
        return { name: e.getAttribute("aria-label") || e.innerText.split("\n")[0], tag: e.tagName, outline: cs.outlineStyle + " " + cs.outlineWidth + " " + cs.outlineColor };
  - assertVisually: The book's cover in the Your books shelf shows a clearly visible keyboard focus indicator (outline or ring) that follows the cover's corners
  - press: Tab
  - javascript:
      environment: browser
      saveAs: STOP_4
      code: |-
        const e = document.activeElement; const cs = getComputedStyle(e);
        return { name: e.getAttribute("aria-label") || e.innerText.split("\n")[0], outline: cs.outlineStyle + " " + cs.outlineWidth + " " + cs.outlineColor };
  - assertVisually: The three-dot more actions button under the book's cover shows a clearly visible keyboard focus indicator
  - press: Enter
  - press: Tab
  - javascript:
      environment: browser
      saveAs: STOP_5
      code: |-
        const e = document.activeElement; const cs = getComputedStyle(e);
        return { name: e.getAttribute("aria-label") || e.innerText.split("\n")[0], outline: cs.outlineStyle + " " + cs.outlineWidth + " " + cs.outlineColor };
  - assertVisually: The Edit item in the small panel under the book shows a clearly visible keyboard focus indicator
  - press: Enter
  - checkElementFocused: Title input
  - press: Escape
  - javascript:
      environment: browser
      saveAs: AFTER_ESCAPE
      code: |-
        return { focus: document.activeElement.getAttribute("aria-label"), formOpen: !!document.querySelector("form.shelf-edit"), panelOpen: !!document.querySelector(".shelf-menu-panel") };
  - press: Enter
  - press: Tab
  - press: Tab
  - press: Enter
  - checkPageContains: Keep
  - javascript:
      environment: browser
      saveAs: CONFIRM_FOCUS
      code: |-
        return { focus: document.activeElement.innerText };
  - press: Enter
  - checkPageContains: The Problems of Philosophy
  - javascript:
      environment: browser
      saveAs: AFTER_KEEP
      code: |-
        return { focus: document.activeElement.getAttribute("aria-label"), confirmShown: !!document.querySelector(".shelf-confirm") };
