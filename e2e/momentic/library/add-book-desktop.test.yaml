fileType: momentic/test/v2
id: library-add-book-desktop
description: A reader adds the fixture book with the Add a book button, sees progress feedback, lands in the reader, returns to the library and checks how the book is listed. Run from the repo root (fileUpload paths are relative to it).
viewport: 1440, 900
before:
  - module: ./modules/reset-library.module.yaml
steps:
  - refresh
  - fileUpload: e2e/fixtures/problems-of-philosophy.pdf
  - click: Add a book button
  - checkPageContains: A long book can take a minute.
  - waitForUrl:
      substring: /book/
      timeout: 30000
  - assertVisually: The reader page has opened for The Problems of Philosophy and shows readable book text near the top of the page
  - javascript:
      code: |-
        return { url: location.href, title: document.title, topbar: document.querySelector("header")?.innerText.split("\n").slice(0, 3).join(" | ") };
      environment: browser
      saveAs: LANDING
  - click: Back to your books
  - checkPageContains: Your books
  - assertVisually: The Your books shelf has one cover for The Problems of Philosophy, with the title stamped on it in serif. Under the cover are a thin progress line, a short grey line about the time to read or left, and a three-dot button at the right. Everything is aligned and nothing overflows
  - javascript:
      code: |-
        const row = document.querySelector(".shelf-item");
        return { rowText: row?.innerText, buttons: [...row.querySelectorAll("button, a")].map((e) => e.getAttribute("aria-label") || e.innerText) };
      environment: browser
      saveAs: ROW
  # The reader saves the place about a second after a book opens, so the shelf says either how long it takes to read or how much is left.
  - javascript:
      code: |-
        if (!/(to read|left)/.test(env.ROW.rowText)) throw new Error(`The book on the shelf does not say how long it takes to read or how much is left: ${env.ROW.rowText}`);
