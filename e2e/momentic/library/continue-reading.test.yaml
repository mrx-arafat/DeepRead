fileType: momentic/test/v2
id: library-continue-reading
description: A reader reads for a while, goes back to the library and expects to see how far they got. The library should offer a Continue reading card for the book, and the book's cover on the shelf should show its progress. Run from the repo root.
viewport: 1440, 900
before:
  - module: ./modules/reset-library.module.yaml
steps:
  - refresh
  - module: ./modules/add-fixture-book.module.yaml
  - scrollDown: 3000
  - wait: 2500
  - javascript:
      code: |-
        const res = await fetch(`${env.BASE_URL}/api/books`);
        const books = await res.json();
        return books.map((b) => ({ title: b.title, progress: b.progress }));
      saveAs: API_AFTER_READING
  - click: Back to your books
  - checkPageContains: Your books
  - checkPageContains: Continue reading
  - assert: A Continue reading card shows the book with the chapter where the reader stopped, a percentage, the time left and a Continue button, and the book's cover on the shelf shows a progress line with a percentage
  - click: Continue button
  - waitForUrl: /book/
  - assertVisually: The reader has opened for The Problems of Philosophy
