fileType: momentic/test/v2
id: library-continue-reading
description: A reader reads for a while, goes back to the library and expects to see how far they got. The book row should show reading progress or a Continue action (currently it only shows total length). Run from the repo root.
viewport: 1440, 900
before:
  - module: ./modules/reset-library.module.yaml
steps:
  - refresh
  - module: ./modules/add-fixture-book.module.yaml
  - scrollDown: 3000
  - wait: 2500
  - javascript:
      code: |-
        const res = await fetch(`${env.BASE_URL}/api/books`);
        const books = await res.json();
        return books.map((b) => ({ title: b.title, progress: b.progress }));
      saveAs: API_AFTER_READING
  - click: Back to your books
  - checkPageContains: Your books
  - assert: The library row for the book tells the reader how far they have read (a percentage, a chapter, or last-read text) or offers a Continue reading action
