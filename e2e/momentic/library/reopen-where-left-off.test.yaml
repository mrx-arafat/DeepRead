fileType: momentic/test/v2
id: library-reopen-where-left-off
description: After reading part of a chapter and going back to the library, opening the book again reopens it near where the reader stopped. Run from the repo root.
viewport: 1440, 900
before:
  - module: ./modules/reset-library.module.yaml
steps:
  - refresh
  - module: ./modules/add-fixture-book.module.yaml
  - scrollDown: 3000
  - wait: 2500
  - javascript:
      code: |-
        return { scrollY: window.scrollY, topbar: document.querySelector("header")?.innerText.split("\n").slice(0, 3).join(" | ") };
      environment: browser
      saveAs: BEFORE_LEAVING
  - click: Back to your books
  - checkPageContains: Your books
  - click: The Problems of Philosophy book title in the list
  - waitForUrl: /book/
  - wait: 2000
  - javascript:
      code: |-
        return { url: location.href, scrollY: window.scrollY, topbar: document.querySelector("header")?.innerText.split("\n").slice(0, 3).join(" | ") };
      environment: browser
      saveAs: REOPENED
  - assertVisually: The reader reopened part way into the book, with the heading of the chapter it opened at scrolled out of view
