fileType: momentic/module/v2
id: deepread-library-add-fixture
name: add-fixture-book
description: Adds the public-domain fixture book through the Add a book (PDF) button and waits for the reader to open. The file path is relative to the directory momentic is run from (the repo root).
steps:
  - fileUpload: e2e/fixtures/problems-of-philosophy.pdf
  - click: Add a book (PDF) button
  - waitForUrl: /book/
  # The book opens at its own text (the preface), past the title page and contents.
  - checkElementVisible:
      css: "main.page > article.chapter:nth-of-type(1) .chapter-text"
      timeout: 30000
