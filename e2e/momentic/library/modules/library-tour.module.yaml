fileType: momentic/module/v2
id: deepread-library-tour
name: library-tour
description: One pass through every visible state of the library page (empty, error, list, edit form, long title, remove confirm, drag highlight) in the given theme (light or dark), judging layout and recording WCAG contrast ratios per state in env.T_*. The viewport comes from the calling test. The file paths are relative to the repo root.
parameters:
  - name: THEME
steps:
  - localStorage:
      key: deepread.prefs
      value: '{"theme":"{{ env.THEME }}"}'
  - refresh
  - javascript:
      environment: browser
      code: |-
        const parse = (c) => { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return { r: p[0], g: p[1], b: p[2], a: p[3] ?? 1 }; };
        const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
        const lum = (c) => 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
        const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return Math.round(((x + 0.05) / (y + 0.05)) * 100) / 100; };
        const bgOf = (el) => { for (let e = el; e; e = e.parentElement) { const c = parse(getComputedStyle(e).backgroundColor); if (c && c.a > 0.99) return c; } return parse(getComputedStyle(document.body).backgroundColor); };
        window.__measure = () => {
          const out = { theme: document.documentElement.dataset.theme, viewport: `${innerWidth}x${innerHeight}`, text: {}, borders: {}, sizes: {} };
          const text = (name, sel) => { const el = document.querySelector(sel); if (!el) return; out.text[name] = ratio(parse(getComputedStyle(el).color), bgOf(el)); };
          const border = (name, sel) => { const el = document.querySelector(sel); if (!el) return; const b = parse(getComputedStyle(el).borderTopColor); if (b) out.borders[name] = ratio(b, bgOf(el.parentElement || el)); };
          const size = (name, sel) => { const el = document.querySelector(sel); if (!el) return; const r = el.getBoundingClientRect(); out.sizes[name] = `${Math.round(r.width)}x${Math.round(r.height)}`; };
          text("intro", ".library-head p"); text("dropHint", ".drop-hint"); text("addLabel", ".drop .button"); text("sectionHeading", ".library-section");
          text("bookTitle", ".shelf-item .cover-title"); text("bookAuthor", ".shelf-item .cover-author"); text("bookMeta", ".shelf-meta"); text("bookLead", ".shelf-meta-lead");
          text("continueTitle", ".continue-title"); text("continueLeft", ".continue-left"); text("continueButton", ".continue-action"); text("continueChapter", ".continue-chapter");
          text("emptyState", ".library-empty"); text("emptyMore", ".library-empty-more"); text("error", ".inline-error");
          text("editLabel", ".shelf-field label"); text("cancelLabel", ".shelf-edit-actions .quiet-button"); text("keepLink", ".shelf-confirm .link-button:not(.danger)");
          text("removeLink", ".shelf-confirm .link-button.danger"); text("rowIcon", ".icon-button");
          // The drop box has an edge only on a first visit (dashed); with books on the shelf the add button carries its own.
          if (document.querySelector(".library-top[data-empty]")) border("dropBox", ".drop"); else border("addButton", ".drop .button");
          border("textField", ".shelf-field input"); border("cancelButton", ".shelf-edit-actions .quiet-button");
          size("addButton", ".drop .button"); size("continueButton", ".continue-action"); size("rowIcon", ".icon-button"); size("removeLink", ".shelf-confirm .link-button.danger"); size("keepLink", ".shelf-confirm .link-button:not(.danger)"); size("rowLink", ".shelf-link");
          out.overflowX = document.documentElement.scrollWidth - innerWidth;
          return out;
        };
        return document.documentElement.dataset.theme;
      saveAs: T_THEME
  - assertVisually: The library page has a bold serif DeepRead title, a short grey intro, and a dashed welcome box. In the box stand a few faded books on a shelf board, the sentence No books yet. Add a PDF to start reading., a line saying each book gets a cover, and a blue Add a book (PDF) button (on a wide screen also the hint "or drop a PDF here"; a phone leaves it out, since a phone cannot drop files). Text is readable against the background, spacing is even and nothing is cut off
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_EMPTY
  - fileUpload: data/e2e-library/notes.txt
  - click:
      on: Add a book (PDF) button
      retries: 2
  - checkPageContains: That file is not a PDF
  - assertVisually: A readable red error sentence sits under the dashed welcome box, the box has not changed size, and the No books yet sentence is still inside it
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_ERROR
  - fileUpload: e2e/fixtures/problems-of-philosophy.pdf
  - click:
      on: Add a book (PDF) button
      retries: 2
  - waitForUrl: /book/
  # The book opens at its own text (the preface), past the title page and contents.
  - checkElementVisible:
      css: "main.page > article.chapter:nth-of-type(1) .chapter-text"
      timeout: 30000
  # The reader saves the place about a second after a book opens, so the library has somewhere to continue from.
  - wait: 2000
  - click: Back to your books
  - checkPageContains: Your books
  - assertVisually: Under a Continue reading heading a card shows the book cover, the title in serif, the chapter, a progress line with its percentage and the time left, and a blue Continue button at the right (a phone puts the button below, full width). Under the Your books heading there is one cloth-coloured book cover with the title stamped in cream serif, a thin progress line, a smaller line of grey text and a three-dot button. Contrast is comfortable and nothing overlaps
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_LIST
  - click: More actions for The Problems of Philosophy
  - click: Edit The Problems of Philosophy
  - checkElementFocused: Title input
  - assertVisually: A dialog titled Edit book is open over the dimmed page, with Title and Author fields, a filled Save button and a Cancel button. The field borders, labels and buttons are all clearly visible against the background
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_EDIT
  - fill:
      text: "The Problems of Philosophy - A Complete Introduction to Knowledge, Matter, Universals and the Value of Philosophy (Illustrated Annotated Edition)"
      into: Title input
  - fill:
      text: "Bertrand Arthur William Russell, Third Earl Russell, with a foreword by the editors of the Home University Library"
      into: Author input
  - click: Save button
  - checkPageContains: Illustrated Annotated Edition
  - assertVisually: The Continue reading card shows the very long title wrapped over several lines (cut with an ellipsis after four lines on a phone) and the long author line over up to two lines. The book's cover on the shelf stamps the long title in a small size and cuts the long author line after two lines with an ellipsis. Nothing overlaps, or runs past the screen edge
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_LONG
  - click: the three-dot more actions button under the book's cover
  - click: the red Remove menu item with the bin icon
  - checkPageContains: Keep
  - assertVisually: Under the book's cover a grey box asks whether to remove the book and its notes, with the red word Remove and the blue word Keep. They are clearly separate, readable, and inside the screen, and the cover did not move
  - javascript:
      environment: browser
      code: return window.__measure();
      saveAs: T_CONFIRM
  - click: Keep
  - javascript:
      environment: browser
      saveAs: T_DRAG
      code: |-
        const file = new File([new Blob(["%PDF-1.4"])], "x.pdf", { type: "application/pdf" });
        const dt = new DataTransfer();
        dt.items.add(file);
        document.querySelector(".drop").dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
        await new Promise((r) => setTimeout(r, 200));
        return { dragging: document.querySelector(".drop").dataset.dragging ?? null, measure: window.__measure() };
  - assertVisually: A blue frame runs round the whole window, and the area with the Add a book (PDF) button has a light blue tint inside a blue ring; its text (on a wide screen "Drop the PDF to add it") and button are still easy to read
  - javascript:
      code: |-
        const states = { empty: env.T_EMPTY, error: env.T_ERROR, list: env.T_LIST, edit: env.T_EDIT, long: env.T_LONG, confirm: env.T_CONFIRM, drag: env.T_DRAG.measure };
        const phone = parseInt(env.T_EMPTY.viewport, 10) < 600;
        const minTarget = phone ? 44 : 24;
        const problems = new Set();
        for (const [state, m] of Object.entries(states)) {
          for (const [k, v] of Object.entries(m.text)) if (v < 4.5) problems.add(`text "${k}" has contrast ${v}:1, needs 4.5:1 (${state})`);
          for (const [k, v] of Object.entries(m.borders)) if (v < 3) problems.add(`border of "${k}" has contrast ${v}:1, needs 3:1 (${state})`);
          if (m.overflowX > 0) problems.add(`page scrolls sideways by ${m.overflowX}px (${state})`);
          for (const [k, v] of Object.entries(m.sizes)) {
            const [w, h] = v.split("x").map(Number);
            if (["addButton", "continueButton", "rowIcon", "removeLink", "keepLink"].includes(k) && Math.min(w, h) < minTarget) problems.add(`"${k}" target is ${v}px, needs ${minTarget}px (${state})`);
          }
        }
        if (problems.size) throw new Error(`Polish checks failed in the ${env.THEME} theme at ${env.T_EMPTY.viewport}: ` + [...problems].join("; "));
