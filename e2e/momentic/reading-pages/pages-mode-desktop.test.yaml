fileType: momentic/test/v2
id: dr-read-pages-mode-desktop-isolated
description: "Pages reading journey at desktop: Pages is set before first load, page turns move by one screen, and the setting survives reload."
viewport: "1440, 900"
steps:
  - localStorage:
      key: deepread.prefs
      value: '{"layout":"pages"}'
  - module: ./modules/open-book.module.yaml
  - navigate: /book/{{ env.BOOK_ID }}/c4
  - checkPageContains:
      text: Before you read
      timeout: 15000
  - wait: 3200
  - module: ./modules/page-state.module.yaml
  - javascript: |-
      const p = JSON.parse(env.PAGE);
      assert(p.layout === 'pages', `first load layout is ${p.layout}, not pages`)
      assert(p.overflow === 'hidden', `window overflow is ${p.overflow}`)
      assert(p.cut === 0, `${p.cut} lines are cut on the first page`)
  - press: ArrowRight
  - wait: 700
  - module: ./modules/page-state.module.yaml
  - javascript: |-
      const p = JSON.parse(env.PAGE);
      assert(p.y > 0, `ArrowRight did not turn the page: scrollY ${p.y}`)
      assert(p.cut === 0, `${p.cut} lines are cut after turning`)
  - refresh
  - checkPageContains:
      text: left in chapter
      timeout: 15000
  - module: ./modules/page-state.module.yaml
  - javascript: |-
      const p = JSON.parse(env.PAGE);
      assert(p.layout === 'pages', `reload layout is ${p.layout}, not pages`)
      assert(p.cut === 0, `${p.cut} lines are cut after reload`)
