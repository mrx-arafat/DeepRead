fileType: momentic/module/v2
id: dr-read-m-open-book
name: Open the book from the library
steps:
  # Journeys share one book and run side by side, and opening any chapter is saved as where the reader is, so
  # another journey may have left the reader anywhere (the licence, say). Start every journey from the test
  # library's own place, partway through Chapter II.
  # The shelf is drawn once the list of books has come back: on a busy machine that is after the page itself has loaded.
  - checkElementVisible:
      css: a.shelf-link
      timeout: 15000
  - javascript:
      environment: browser
      code: |-
        const id = document.querySelector('a.shelf-link').getAttribute('href').split('/')[2];
        const res = await fetch(`/api/books/${id}/progress`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chapterId: 'c4', blockId: 'c4-b5' }) });
        if (!res.ok) throw new Error(`could not set where the reader is: ${res.status} ${await res.text()}`);
        return 'reader is in Chapter II';
  - click:
      css: a.shelf-link
  - waitForUrl:
      substring: /book/
      timeout: 15000
  # Wait for the book text, not a preview box: a short section such as the preface has none.
  - checkElementVisible:
      css: "main.page > article.chapter:nth-of-type(1) .chapter-text"
      timeout: 15000
  - javascript:
      environment: browser
      saveAs: BOOK_ID
      code: return location.pathname.split('/')[2]
